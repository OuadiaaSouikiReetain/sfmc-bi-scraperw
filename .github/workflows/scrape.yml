name: BI XML → SFMC CSV

on:
  # ✅ Déclenchement depuis SFMC (ton script POST /dispatches)
  repository_dispatch:
    types: [xml-uploaded]

  # ✅ Déclenchement manuel depuis l'UI GitHub
  workflow_dispatch:

  # ✅ Optionnel : polling toutes les 30 minutes
  # (garde-le seulement si tu veux une sécurité en plus)
  schedule:
    - cron: "*/30 * * * *"

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      - name: Run XML → CSV converter (SFTP)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INCOMING_DIR: /bi/incoming
          OUT_DIR: /bi/out
          ARCHIVE_DIR: /bi/archive
          PROCESSED_LOG: /bi/processed/processed.log
        run: python xml_to_csv_ftp.py
